[project]
name = "auto-split"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=48.0.0",
    "fastapi>=0.136.1",
    "google-genai>=2.3.0",
    "groq>=1.2.0",
    "langfuse>=4.6.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-telegram-bot>=22.7",
    "splitwise>=3.0.0",
    "supabase>=2.30.0",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
]
